<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" fill="none">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#080c16" />
    <stop offset="50%" stop-color="#04060b" />
    <stop offset="100%" stop-color="#0a1220" />
  </linearGradient>
  <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur1" />
    <feGaussianBlur stdDeviation="10" result="blur2" />
    <feMerge>
      <feMergeNode in="blur2" />
      <feMergeNode in="blur1" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00f2fe" />
    <stop offset="50%" stop-color="#4facfe" />
    <stop offset="100%" stop-color="#00f2fe" />
  </linearGradient>
</defs>
<style>
  .banner-bg { fill: url(#bgGrad); stroke: #1f293d; stroke-width: 1.5px; rx: 12px; }
  .grid-line { stroke: #152238; stroke-width: 1px; opacity: 0.45; }
  .logo-text { font-family: "Courier New", Courier, monospace, -apple-system, sans-serif; font-size: 32px; font-weight: 900; letter-spacing: 9px; fill: url(#textGrad); filter: url(#neonGlow); }
  .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; letter-spacing: 4px; fill: #798da8; text-transform: uppercase; font-weight: 500; }
  .tag-bracket { fill: #00f2fe; opacity: 0.8; font-weight: bold; }
  @keyframes radarSweep { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.6); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
  .pulse-dot { fill: #00f2fe; filter: url(#neonGlow); }
</style>
